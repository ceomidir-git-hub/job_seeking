<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>구인공고 검색 · 메일 전달</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f8; --card:#fff; --line:#cfd8e3; --text:#1f2937;
  --sub:#64748b; --yellow:#fffde8; --dark:#1f2937;
  --blue:#2563eb; --green:#137d35;
}
html,body{
  margin:0; width:100%; min-height:100%;
  background:var(--bg); color:var(--text);
  font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
}
body{font-size:16px}
button,input,select{font:inherit}
.page{
  width:min(100%,920px);
  margin:0 auto;
  padding:18px 28px 24px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:14px;
}
.header-card{padding:18px 22px 13px}
h1{
  margin:0;
  font-size:34px;
  line-height:1.08;
  letter-spacing:-1px;
}
.subtitle{
  margin:5px 0 0;
  font-size:16px;
  color:var(--sub);
}
.section{padding:21px 22px}
.section-title{
  margin:0 0 18px;
  font-size:25px;
  line-height:1.15;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px 22px;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px 22px;
  margin-top:15px;
}
.field label,
.field-title{
  display:block;
  margin:0 0 5px;
  font-size:16px;
  font-weight:700;
  color:#334155;
}
.input,.select,.mail-input{
  width:100%;
  height:45px;
  border:1px solid #c8d3df;
  border-radius:8px;
  background:var(--yellow);
  color:var(--text);
  padding:0 11px;
  font-size:17px;
  outline:none;
}
.period-box{
  height:45px;
  border:1px solid #c8d3df;
  border-radius:8px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:8px;
  padding:0 10px;
}
.period-option{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  color:#334155;
}
.period-option input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:#1f2937;
}
.input:focus,.select:focus,.mail-input:focus{
  border-color:#64748b;
  box-shadow:0 0 0 2px rgba(100,116,139,.08);
}
.search-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  margin-top:24px;
}
.btn{
  height:47px;
  border:0;
  border-radius:7px;
  color:#fff;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn-google{background:var(--dark)}
.btn-ai{background:var(--blue)}
.btn-send{
  width:100%;
  height:49px;
  background:var(--green);
  font-size:19px;
}
.status{
  display:none;
  margin-top:12px;
  padding:9px 11px;
  border:1px solid #dbe3ec;
  border-radius:7px;
  background:#f8fafc;
  color:#475569;
  font-size:13px;
  line-height:1.5;
}
.status.show{display:block}
.mail-card{padding:20px 22px}
.consent{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:14px;
  font-size:16px;
  color:#334155;
  cursor:pointer;
}
.consent input{
  width:19px;
  height:19px;
  accent-color:var(--green);
}
.send-card{padding:18px 22px 13px}
.send-title{
  margin:0 0 12px;
  font-size:21px;
}
.note{
  margin:11px 0 0;
  font-size:14px;
  color:var(--sub);
  line-height:1.45;
}
@media(max-width:760px){
  .page{padding:8px}
  .card{margin-bottom:8px;border-radius:9px}
  .header-card{padding:12px 14px 9px}
  h1{font-size:25px}
  .subtitle{font-size:12px}
  .section,.mail-card{padding:14px}
  .section-title{font-size:20px;margin-bottom:13px}
  .grid3{gap:8px}
  .grid2{gap:8px;margin-top:10px}
  .field label,.field-title{font-size:12px;margin-bottom:4px}
  .input,.select,.mail-input{height:39px;font-size:13px;padding:0 7px}
  .period-box{height:39px;padding:0 6px;gap:4px}
  .period-option{font-size:11.5px;gap:3px}
  .period-option input{width:14px;height:14px}
  .search-buttons{gap:8px;margin-top:14px}
  .btn{height:42px;font-size:14px}
  .consent{font-size:13px;margin-top:11px}
  .send-card{padding:13px 14px 9px}
  .send-title{font-size:17px}
  .btn-send{height:43px;font-size:15px}
  .note{font-size:11.5px;margin-top:8px}
}
@media(max-width:420px){
  .grid3{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr 1fr}
  h1{font-size:22px}
}
</style>
</head>

<body>
<main class="page">

<section class="card header-card">
  <h1>구인공고 검색 · 메일 전달</h1>
  <p class="subtitle">검색된 업체의 핵심정보만 정리하여 Gmail로 보내는 구조</p>
</section>

<section class="card section">
  <h2 class="section-title">검색 조건</h2>

  <div class="grid3">
    <div class="field">
      <span class="field-title">검색기간</span>
      <div class="period-box">
        <label class="period-option">
          <input type="radio" name="period" value="1m">
          <span>1달 이내</span>
        </label>
        <label class="period-option">
          <input type="radio" name="period" value="2w">
          <span>2주 이내</span>
        </label>
        <label class="period-option">
          <input type="radio" name="period" value="1w" checked>
          <span>1주일 이내</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label for="industry">업종</label>
      <input id="industry" class="input" type="text" value="제조업">
    </div>

    <div class="field">
      <label for="region">지역</label>
      <input id="region" class="input" type="text" value="창원">
    </div>
  </div>

  <div class="grid2">
    <div class="field">
      <label for="keyword">직무·자격 키워드</label>
      <input id="keyword" class="input" type="text" value="전기, PLC">
    </div>

    <div class="field">
      <label for="career">경력구분</label>
      <select id="career" class="select">
        <option value="신입" selected>신입</option>
        <option value="경력">경력</option>
        <option value="경력무관">경력무관</option>
        <option value="">선택 안함</option>
      </select>
    </div>
  </div>

  <div class="search-buttons">
    <button id="googleBtn" class="btn btn-google" type="button">Google 검색</button>
    <button id="aiBtn" class="btn btn-ai" type="button">Google AI 조사</button>
  </div>

  <div id="searchStatus" class="status"></div>
</section>

<section class="card mail-card">
  <h2 class="section-title">메일 보내기</h2>

  <div class="field">
    <label for="email">받는 사람 이메일</label>
    <input id="email" class="mail-input" type="email"
           value="ceomidir@gmail.com"
           autocomplete="email" inputmode="email">
  </div>

  <label class="consent">
    <input id="consent" type="checkbox" checked>
    <span>구인정보 수신을 요청한 사람입니다.</span>
  </label>
</section>

<section class="card send-card">
  <h2 class="send-title">검색 완료 후</h2>
  <button id="sendBtn" class="btn btn-send" type="button">검색결과 메일 보내기</button>
  <p class="note">※ 공고 원문 전체가 아니라 핵심정보와 원문 URL만 전송</p>
  <div id="mailStatus" class="status"></div>
</section>

</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const industryEl = $("industry");
  const regionEl = $("region");
  const keywordEl = $("keyword");
  const careerEl = $("career");
  const emailEl = $("email");
  const consentEl = $("consent");

  const googleBtn = $("googleBtn");
  const aiBtn = $("aiBtn");
  const sendBtn = $("sendBtn");

  const searchStatus = $("searchStatus");
  const mailStatus = $("mailStatus");

  let lastSearchMode = "";
  let lastSearchUrl = "";

  function pad2(n){ return String(n).padStart(2,"0"); }

  function formatDate(d){
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }

  function today(){
    const n = new Date();
    return new Date(n.getFullYear(),n.getMonth(),n.getDate());
  }

  function selectedPeriod(){
    return document.querySelector('input[name="period"]:checked')?.value || "1w";
  }

  function getPeriod(){
    const end = today();
    const start = new Date(end);
    const type = selectedPeriod();
    let label = "1주일 이내";

    if(type === "1w"){
      start.setDate(start.getDate()-6);   // 오늘 포함 7일
      label = "1주일 이내";
    }else if(type === "2w"){
      start.setDate(start.getDate()-13);  // 오늘 포함 14일
      label = "2주 이내";
    }else{
      start.setMonth(start.getMonth()-1);
      label = "1달 이내";
    }

    return {
      label,
      start:formatDate(start),
      end:formatDate(end)
    };
  }

  function getFilters(){
    return {
      period:getPeriod(),
      industry:industryEl.value.trim(),
      region:regionEl.value.trim(),
      keyword:keywordEl.value.trim(),
      career:careerEl.value.trim()
    };
  }

  function splitKeywords(){
    return keywordEl.value
      .split(/[,/|]+/)
      .map(v => v.trim())
      .filter(Boolean);
  }

  function showStatus(el,text){
    el.textContent = text;
    el.classList.add("show");
  }

  function buildGoogleQuery(){
    const f = getFilters();
    const terms = [];

    if(f.region) terms.push(f.region);
    if(f.industry) terms.push(f.industry);

    const keys = splitKeywords();
    if(keys.length === 1){
      terms.push('"' + keys[0].replace(/"/g,"") + '"');
    }else if(keys.length > 1){
      terms.push("(" + keys.map(k => '"' + k.replace(/"/g,"") + '"').join(" OR ") + ")");
    }

    if(f.career) terms.push(f.career);
    terms.push("(채용 OR 모집 OR 구인)");

    const tomorrow = today();
    tomorrow.setDate(tomorrow.getDate()+1);

    terms.push("after:" + f.period.start);
    terms.push("before:" + formatDate(tomorrow));

    return terms.join(" ");
  }

  function buildAIQuery(){
    const f = getFilters();
    const keys = splitKeywords();

    return [
      "대한민국의 실제 공개 채용공고를 조사해줘.",
      "검색기간은 오늘 기준 " + f.period.label + " (" + f.period.start + " ~ " + f.period.end + ")이다.",
      f.industry ? "업종은 " + f.industry + "이다." : "",
      f.region ? "근무지역은 " + f.region + "이다." : "",
      keys.length ? "직무·자격 키워드는 " + keys.join(", ") + "이다." : "",
      f.career ? "경력구분은 " + f.career + "이다." : "",
      "조건과 맞지 않는 공고와 이미 마감된 공고는 제외해줘.",
      "회사명, 모집직종, 근무지역, 경력, 학력, 급여, 게시일, 마감일, 상태, 관련성, 출처, 원문 URL 순으로 핵심정보만 정리해줘.",
      "확인되지 않은 값은 추측하지 말고 '확인 필요'라고 표시해줘."
    ].filter(Boolean).join(" ");
  }

  function runGoogleSearch(){
    const q = buildGoogleQuery();
    const url = "https://www.google.com/search?hl=ko&q=" + encodeURIComponent(q);

    lastSearchMode = "Google 검색";
    lastSearchUrl = url;

    showStatus(searchStatus,"Google 검색을 새 탭에서 열었습니다.");
    window.open(url,"_blank","noopener,noreferrer");
  }

  function runGoogleAI(){
    const q = buildAIQuery();
    const url = "https://www.google.com/search?udm=50&hl=ko&q=" + encodeURIComponent(q);

    lastSearchMode = "Google AI 조사";
    lastSearchUrl = url;

    showStatus(searchStatus,"Google AI 조사를 새 탭에서 열었습니다.");
    window.open(url,"_blank","noopener,noreferrer");
  }

  function openGmail(){
    const to = emailEl.value.trim();

    if(!to){
      alert("받는 사람 이메일 주소를 입력해 주세요.");
      emailEl.focus();
      return;
    }

    if(!emailEl.checkValidity()){
      alert("이메일 주소 형식을 확인해 주세요.");
      emailEl.focus();
      return;
    }

    if(!consentEl.checked){
      alert("구인정보 수신 요청 여부를 확인해 주세요.");
      consentEl.focus();
      return;
    }

    if(!lastSearchMode){
      alert("먼저 Google 검색 또는 Google AI 조사를 실행해 주세요.");
      return;
    }

    const f = getFilters();

    const subject =
      "[맞춤 구인정보] " +
      (f.region || "지역") + " " +
      (f.keyword || "직무") + " " +
      (f.career || "") + " 구인정보";

    const body = [
      "[맞춤 구인정보]",
      "조사일: " + formatDate(today()),
      "검색조건: " +
        f.period.label + " / " +
        (f.industry || "업종 미지정") + " / " +
        (f.region || "지역 미지정") + " / " +
        "직무·자격 키워드 " + (f.keyword || "미지정") + " / " +
        "경력 " + (f.career || "미지정"),
      "검색방식: " + lastSearchMode,
      "",
      "※ 검색 결과 전체를 저장하지 않고, 조건에 맞는 핵심정보와 원문 링크만 정리하여 전달합니다.",
      "",
      "[검색 페이지]",
      lastSearchUrl,
      "",
      "※ 실제 모집조건, 마감 여부 및 지원방법은 반드시 원문 채용공고에서 다시 확인하시기 바랍니다."
    ].join("\n");

    const gmailUrl =
      "https://mail.google.com/mail/?view=cm&fs=1" +
      "&to=" + encodeURIComponent(to) +
      "&su=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    showStatus(mailStatus,"Gmail 작성창을 열었습니다. 내용을 확인한 뒤 Gmail의 보내기 버튼을 누르면 실제 메일이 발송됩니다.");
    window.open(gmailUrl,"_blank","noopener,noreferrer");
  }

  googleBtn.addEventListener("click",runGoogleSearch);
  aiBtn.addEventListener("click",runGoogleAI);
  sendBtn.addEventListener("click",openGmail);
})();
</script>
</body>
</html>
